<main class="container-fluid min-vh-100">
    <div class="row min-vh-100 align-items-center justify-content-center">
        <section class="col-lg-6 d-none d-lg-flex login-brand p-5">
            <div>
                <div class="brand-mark">FR</div>
                <p class="eyebrow">GESTIÓN COMERCIAL</p>
                <h1 class="display-5 fw-bold">Ferretería<br>La Reina</h1>
                <p class="lead mt-3">Una forma sencilla de administrar inventario, compras y ventas.</p>
            </div>
        </section>
        <section class="col-12 col-sm-10 col-md-7 col-lg-4 p-4">
            <div class="login-card">
                <div class="brand-mark brand-mark-small d-lg-none mb-3">FR</div>
                <p class="eyebrow mb-2">BIENVENIDO/A</p>
                <h2 class="h3 fw-bold mb-2">Iniciar sesión</h2>
                <p class="text-secondary mb-4">Ingresa tus datos para continuar.</p>
                <form id="loginForm">
                    <label for="email" class="form-label">Correo electrónico</label>
                    <input id="email" class="form-control form-control-lg mb-3" type="email"
                        placeholder="usuario@ejemplo.com" required>
                    <label for="password" class="form-label">Contraseña</label>
                    <div class="input-group input-group-lg mb-3">
                        <input id="password" class="form-control" type="password" placeholder="Tu contraseña" required>
                        <button class="btn btn-outline-secondary" type="button" id="togglePassword"
                            aria-label="Mostrar contraseña">Mostrar</button>
                    </div>
                    <div class="d-flex justify-content-between align-items-center small mb-4">
                        <div class="form-check"><input class="form-check-input" type="checkbox" id="remember"><label
                                class="form-check-label" for="remember">Recordarme</label></div>
                        <a href="#" class="link-orange">¿Olvidaste tu contraseña?</a>
                    </div>
                    <button class="btn btn-orange btn-lg w-100" type="submit">Ingresar</button>
                </form>
                <p class="small text-secondary mt-4 mb-0">Plantilla demostrativa: usa cualquier correo y contraseña.</p>
            </div>
        </section>
    </div>
</main>
